[project]
name = "trackflow-services"
version = "0.1.0"
description = "TrackFlow supplier directory seed command"
requires-python = ">=3.12"
dependencies = [
    "email-validator>=2.3.0",
    "pydantic>=2.14.0",
    "pydantic-settings>=2.15.0",
    "sqlmodel>=0.0.48",
    "tinydb>=4.9.0",
]

[project.scripts]
seed = "api.seed:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["api*"]

[tool.uv]
package = true
# The application virtualenv already contains the API stack. Leaving it
# unmanaged stops `uv run seed` from removing those packages.
managed = false
